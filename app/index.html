<!DOCTYPE html>

</head>

<!-- ============ lock screen ============ -->
<div class="lock" id="lockScreen">
  <div class="lock-card">
    <div class="brand brand-lg">
      <span class="brand-mark">P</span>
      <div>
        <strong>Planner Pro</strong>
        <small>Offline day · week · year planner</small>
      </div>
    </div>

    <div id="lockBody">
      <p class="lock-hint" id="lockHint">Choose a profile</p>
      <div class="lock-users" id="lockUsers"></div>

      <form class="pin-row" id="pinForm" hidden>
        <input type="password" id="pinInput" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" autocomplete="off" aria-label="PIN">
        <button class="btn" type="submit">Unlock</button>
      </form>
      <button class="btn btn-ghost btn-block" id="lockBack" hidden type="button">← Other profiles</button>

      <details class="new-user" id="newUserBox">
        <summary>Create a new profile</summary>
        <div class="stack">
          <input type="text" id="newUserName" placeholder="Your name" autocomplete="name">
          <input type="password" id="newUserPin" inputmode="numeric" maxlength="4" placeholder="Choose a 4-digit PIN" autocomplete="new-password">
          <button class="btn" type="button" id="createUserBtn">Create profile</button>
        </div>
      </details>
    </div>

    <p class="lock-foot">No accounts. No servers. Everything stays in this browser.</p>
  </div>
</div>

<!-- ============ app shell ============ -->
<div class="app" id="app" hidden>
  <aside class="rail" id="rail">
    <div class="brand">
      <span class="brand-mark">P</span>
      <div class="brand-text">
        <strong>Planner&nbsp;Pro</strong>
        <small id="railSub">v14</small>
      </div>
    </div>
    <nav class="rail-nav" id="railNav" aria-label="Main"></nav>
    <div class="rail-foot">
      <button class="user-btn" data-act="account" id="railUser">
        <span class="avatar" id="railAvatar">S</span>
        <span class="user-meta"><strong id="railName">—</strong><small id="railSince">—</small></span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-lead">
        <h1 id="pageTitle">Today</h1>
        <p id="pageSub" class="page-sub"></p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-search" data-act="palette" title="Search &amp; commands (Ctrl/⌘ K)">
          <svg class="i"><use href="#i-search"/></svg><span class="btn-label">Search</span><kbd class="kbd-hint">⌘K</kbd>
        </button>
        <button class="icon-btn" data-act="cycle-theme" title="Cycle theme" aria-label="Cycle theme"><svg class="i"><use href="#i-theme"/></svg></button>
        <button class="icon-btn" data-act="lock" title="Lock" aria-label="Lock app"><svg class="i"><use href="#i-lock"/></svg></button>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <button class="fab" data-act="quick-add" aria-label="Quick add"><svg class="i"><use href="#i-plus"/></svg></button>
</div>

<!-- ============ command palette ============ -->
<div class="scrim" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette-input">
      <svg class="i"><use href="#i-search"/></svg>
      <input type="text" id="paletteInput" placeholder="Search tasks, notes, or type a command…" autocomplete="off" spellcheck="false">
      <kbd class="kbd-hint">esc</kbd>
    </div>
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>

<!-- ============ modal ============ -->
<div class="scrim" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Title</h2>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="liveRegion" class="sr-only" role="status" aria-live="polite"></div>
<div class="save-dot" id="saveDot" title="All changes saved">Saved</div>

<script src="assets/js/app.js"></script>
</body>
</html>
