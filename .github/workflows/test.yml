name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v1

      # only the test tooling — the app itself has no dependencies
      - run: npm install --no-audit --no-fund --no-save puppeteer-core

      - name: Run the end-to-end suite
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test

      - name: Build the single-file app
        run: npm run build:single

      - uses: actions/upload-artifact@v4
        with:
          name: planner-pro-single-file
          path: dist/planner-pro.html
