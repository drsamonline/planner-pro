name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || \
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Capacitor
        run: |
          npm install --no-audit --no-fund --no-save @capacitor/cli @capacitor/core @capacitor/android
          cp build/android/capacitor.config.json .

      - name: Add the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename the artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk planner-pro-${GITHUB_REF_NAME:-debug}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: planner-pro-apk
          path: planner-pro-*.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: planner-pro-*.apk
